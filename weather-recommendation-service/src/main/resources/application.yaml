spring:
  application:
    name: weather-recommendation-service
  ai:
    openai:
      base-url: https://ollama.com
      chat:
        options:
          model: gpt-oss:20b-cloud
      embedding:
        base-url: https://integrate.api.nvidia.com
        options:
          model: nvidia/llama-3.2-nemoretriever-300m-embed-v2
    vectorstore:
      mongodb:
        initialize-schema: true
        collection-name: vector_store
        index-name: vector_index
        path-name: embedding
  data:
    mongodb:
      database: weather-recommendation
  kafka:
    bootstrap-servers: localhost:9094
    properties:
      schema.registry.url: http://localhost:8081
      specific.avro.reader: true
    consumer:
      group-id: recommendation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        spring.json.trusted.packages: "*"
        specific.avro.reader: true
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

logging:
  level:
    org.springframework.ai.chat: DEBUG
    embedding: DEBUG

kafka:
  weather:
    topic:
      trends: weather-trends
    alert:
      topic:
        hot_weather: alert-hot-weather
        window-size: 30m

prompts:
  weather:
    recommendation: |
      You are an expert meteorological assistant.
      You will receive structured weather information.
      Your task is to analyze the provided data and generate a practical, human-friendly recommendation.
      
      INPUT DATA:
        - City: {city}
      
        - Average temperature: {avgTemperature}
        - Minimum temperature: {minTemperature}
        - Maximum temperature: {maxTemperature}
        - Average humidity: {avgHumidity}
        - Average wind speed: {avgWindSpeed}
        - Average pressure: {avgPressure}
      
      REQUIREMENTS:
      1. Use ONLY the given input data; do not invent additional weather facts.
      2. Provide a concise recommendation focused on safety, comfort, and planning.
      3. Explain the reasoning clearly but briefly.
      4. Format your final response in the following structure:
        
        RECOMMENDATION:
        <one-paragraph recommendation>
        
        RATIONALE:
        <explain the key weather factors influencing the recommendation>
      
      5. The response must be deterministic, grounded, and reusable for vector storage.
      
      Begin now.

    summary: |
      You are an expert meteorological assistant. You will receive structured daily weather statistics.
      Your task is to produce a short, factual SUMMARY and one clear RECOMMENDATION based only on the provided values.
      
      INPUT DATA:
        - City: {city}
        - Date: {date}
  
        - Average temperature (°C): {avgTemperature}
        - Minimum temperature (°C): {minTemperature}
        - Maximum temperature (°C): {maxTemperature}
        - Average humidity (%): {avgHumidity}
        - Average wind speed (km/h): {avgWindSpeed}
        - Average pressure (hPa): {avgPressure}
      
      RULES:
      1. Use ONLY the input values. Do NOT invent or assume any other weather facts.
      2. Keep language concise, factual, and deterministic (avoid hedging like "maybe", "could").
      3. Output must be compact and follow the EXACT structure below (no extra sections).
      
      OUTPUT FORMAT (MANDATORY):
      SUMMARY:
      <One short paragraph (1-2 sentences) describing overall conditions using input numbers.>
      
      KEY POINTS:
        - Temperature: <one short bullet stating avg/min/max with simple interpretation>
        - Humidity: <one short bullet with value and interpretation>
        - Wind: <one short bullet with wind speed and any caution if > 40 km/h>
        - Precipitation: <one short bullet with chance% and direct implication>
        - UV & AQI:
            <one short bullet: if UV >= 6 mention sun protection; if AQI > 100 mention poor air quality; otherwise "UV/AQI normal">
      
      RECOMMENDATION:
      <One concise sentence with clear action(s) for safety / comfort / planning.>
      
      RATIONALE:
      <1-3 short bullets tying the recommendation to specific input values (mention the field names and numbers).>
      
      NOTE:
        - Keep each bullet ≤ 20 words.
        - The whole response should be 6–10 short lines so it is compact for vector storage.
        - Begin output immediately with "SUMMARY:" — do not add any preamble.
      
      End.
    weatherAlertSummary: |
      You are an expert meteorological alert analyst. You will receive the fields of a WeatherAlertEvent.
      Your task is to generate a concise, factual summary explaining:
      - What happened
      - Why the alert was triggered
      - How severe the situation is
      - What metrics exceeded thresholds
      - What actions may be relevant for safety or awareness
      
      Use ONLY the provided data. Do NOT invent missing values or additional weather conditions.
      
      INPUT DATA:
      - Alert ID: {alertId}
      - Correlation ID: {correlationId}
      - Source Event ID: {sourceEventId}
      
      - City: {city}
      - Country: {country}
      - Severity: {severity}
      - Reason: {reason}
      
      METRICS:
      - Temperature: {temperature} °C
      - Humidity: {humidity} %
      - Heat Index: {heatIndex} °C
      - Dew Point: {dewPoint} °C
      - Temperature Deviation: {temperatureDeviation} °C
      
      - Timestamp: {timestamp}
      
      IMPORTANT RULES:
      1. The alert occurs because heatIndex and/or dewPoint exceeded predefined thresholds.  
         Explain this fact explicitly using only the values provided.  
      2. Keep the summary deterministic, precise, and grounded strictly in the input fields.  
      3. Avoid vague language. No predictions. No assumptions about future conditions.  
      4. Use a fixed structure exactly as shown below. No extra sections.
      
      OUTPUT FORMAT (MANDATORY):
      
      SUMMARY:
      <2–3 sentence paragraph summarizing what happened, where it occurred, and the severity.>
      
      TRIGGER CAUSE:
      - Heat Index: {heatIndex} °C — state clearly if this value exceeds the expected threshold.
      - Dew Point: {dewPoint} °C — state clearly if this value exceeds the expected threshold.
      - Additional contributing metric(s): mention temperature, humidity, or temperatureDeviation only if directly relevant.
      
      DETAILS:
      - Location: {city}, {country}
      - Severity Level: {severity}
      - Reason: <use the provided {reason} without rewriting its core meaning>
      - Timestamp: {timestamp}
      
      RECOMMENDATION:
      <One deterministic sentence with actionable advice relevant to elevated heatIndex/dewPoint conditions.>
      
      RATIONALE:
      - Explain in 1–3 bullets how the provided metrics justify the recommendation.
      
      NOTE:
      - Begin immediately with "SUMMARY:" in the final output.
      - Keep the entire response compact (8–12 lines total) for vector storage.
      - Never include any information not present in the input.
      
      End.